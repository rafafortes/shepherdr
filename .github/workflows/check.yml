# GitHub Actions is OFF on this repo (2026-11-06): its runs were stuck and GitHub refused new ones, so the whole check
# (the types, every test with the browser ones, the build) runs on the machine the agents work on instead:
#
#   bun run check:local        # scripts/check-local.sh; AGENTS.md, "Tests"
#
# This file stays for a run asked for by hand (`gh workflow run check.yml --ref <branch>`, then `gh run watch`), which
# is what workflow_dispatch is; it starts nothing by itself. Keep it free of anything that runs without being asked:
# Shepherdr reads a workflow on a pull request as one whose checks will show up on the pull request, and holds a merge
# until they do (server/live/engine/git.ts, hasPrWorkflows). No run hangs on this: a check is local, or it is asked for.
name: Check

on:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # tests that make commits need someone to make them, whatever HOME they run with
  GIT_AUTHOR_NAME: CI
  GIT_AUTHOR_EMAIL: ci@localhost
  GIT_COMMITTER_NAME: CI
  GIT_COMMITTER_EMAIL: ci@localhost
  # each file's time on the last run, which balances the shards (scripts/test.ts keeps it there)
  TIMINGS: node_modules/.cache/shepherdr-test/timings.json

jobs:
  types:
    name: types and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # every shard finishes, so one run shows every failure
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Chromium's headless shell for playwright-core, at the version it wants, and WebKit, Safari's engine, for an
      # iPhone's tests (layout-iphone.test.ts), with the libraries it needs
      - id: playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-webkit-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: bun x playwright-core install --only-shell chromium && bun x playwright-core install webkit
      - run: bun x playwright-core install-deps webkit
      # the screen the browser tests open (test/web.ts), built from these files: a build of other files is left unused
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/shepherdr-test/dist-*
          key: screen-maps-${{ hashFiles('index.html', 'vite.config.ts', 'tsconfig.json', 'package.json', 'bun.lock', 'plugins.json', 'src/**', 'plugins/**', 'shared/**', 'public/**') }}
      # the newest times any shard saved: each carries every file's time forward, with its own files' fresh ones
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.TIMINGS }}
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
      # which lines of the screen each browser test runs: a run asked for by hand still leaves a map behind, and a
      # local run keeps one of its own too (bun run check:local)
      - run: bun run test --shard=${{ matrix.shard }}/3 --map=screen-map.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-map-${{ matrix.shard }}
          path: screen-map.json
          if-no-files-found: ignore
          retention-days: 30
      # only a help: it never fails the check
      - if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.TIMINGS }}
          key: test-timings-${{ github.run_id }}-${{ matrix.shard }}
